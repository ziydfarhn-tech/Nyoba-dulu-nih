<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Mahasiswa - Glass Effect</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            /* Latar belakang gradien cerah agar efek kaca terlihat jelas */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            overflow: hidden; /* Mencegah scroll jika dekorasi keluar layar */
        }

        /* Lingkaran dekorasi di background */
        .circle-1, .circle-2 {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.4), rgba(255,255,255,0.1));
            z-index: -1;
        }
        .circle-1 {
            width: 250px;
            height: 250px;
            top: 10%;
            left: 20%;
        }
        .circle-2 {
            width: 200px;
            height: 200px;
            bottom: 15%;
            right: 25%;
        }

        /* Efek Glassmorphism pada Kartu Utama */
        .profile-card { 
            background: rgba(255, 255, 255, 0.15); /* Warna dasar transparan */
            backdrop-filter: blur(16px); /* Efek blur/kaca dari background */
            -webkit-backdrop-filter: blur(16px); /* Dukungan untuk browser Safari */
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); /* Bayangan lembut */
            border: 1px solid rgba(255, 255, 255, 0.3); /* Border semi-transparan */
            width: 350px; 
            text-align: center; 
            color: #ffffff; /* Mengubah teks menjadi putih agar kontras */
            z-index: 1;
        }

        .profile-card img { 
            width: 110px; 
            height: 110px; 
            border-radius: 50%; 
            object-fit: cover; 
            margin-bottom: 15px; 
            border: 3px solid rgba(255, 255, 255, 0.5); 
        }

        .profile-card h2 { 
            margin: 0; 
            font-size: 24px; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .profile-card p { 
            margin: 5px 0 25px; 
            font-size: 14px; 
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
        }

        /* Efek pada setiap baris informasi */
        .info-group { 
            text-align: left; 
            margin-bottom: 15px; 
            background-color: rgba(255, 255, 255, 0.1); /* Sedikit transparan */
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: transform 0.3s ease;
        }
        
        .info-group:hover {
            transform: translateX(5px); /* Efek gerak saat disentuh mouse */
            background-color: rgba(255, 255, 255, 0.2);
        }

        .info-label { 
            font-weight: bold; 
            color: rgba(255, 255, 255, 0.7); 
            display: block; 
            font-size: 12px; 
            text-transform: uppercase; 
            margin-bottom: 5px; 
        }

        .info-value { 
            color: #ffffff; 
            font-size: 16px; 
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- Lingkaran abstrak di belakang -->
    <div class="circle-1"></div>
    <div class="circle-2"></div>

    <div class="profile-card">
        <img src="profile.jpeg" alt="Foto Profil">
        
        <h2>Ahmad Rizki Al Hakim</h2>
        <p>Universitas Pembangunan Jaya</p>

        <div class="info-group">
            <span class="info-label">Nama Lengkap</span>
            <span class="info-value">Ahmad Rizki Al Hakim</span>
        </div>
        <div class="info-group">
            <span class="info-label">NIM</span>
            <span class="info-value">2025081017</span>
        </div>
        <div class="info-group">
            <span class="info-label">Program Studi</span>
            <span class="info-value">Sistem Informasi</span>
        </div>
        <div class="info-group">
            <span class="info-label">Kelas</span>
            <span class="info-value">SIF - A</span>
        </div>
    </div>
</body>
</html>
